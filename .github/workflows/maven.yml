# documentation.

#### PC에서 실행 ################################ 
# 네트워크 생성 : docker network create bookmarker-network
# API 실행 : docker run -d --network bookmarker-network -p 18080:8080 --name bookmarker-api chamiseul/bookmarker-api:5.0
# UI 실행 : docker run -d --network bookmarker-network -p 13000:3000 --name bookmarker-ui chamiseul/bookmarker-ui-nextjs:5.0
################################################

name: Java CI with Maven

on:
  push:
    branches: [ "**" ]

jobs:
# API build & Docker Hub Push
  build-bookmarker-api:
    name: Build bookmarker-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bookmarker-api

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'
  
      # Maven build 작업 시 권한으로 인한 접근 허용
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw verify
  
      # docker의 tty 명령어를 사용하기 위한 환경설정
      - name: Build and Publish Docker Image
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          ./mvnw clean package jib:dockerBuild -DskipTests
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t myimage:latest .
          docker tag myimage:latest ${{ secrets.DOCKER_USERNAME }}/bookmarker-api:5.0
          docker push ${{ secrets.DOCKER_USERNAME }}/bookmarker-api:5.0
        env:
          DOCKER_BUILDKIT: 1
          DOCKER_CLI_EXPERIMENTAL: enabled

# UI build & Docker Hub Push
  build-bookmarker-ui:
    name: Build bookmarker-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bookmarker-ui-nextjs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install dependencies
        run: npm ci
      
        # .env.local 은 기본적으로 git에 올라가지 않기때문에 dockerizing 하기전에 미리 생성
      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_CLIENT_SIDE_API_BASE_URL=${{secrets.NEXT_PUBLIC_CLIENT_SIDE_API_BASE_URL}}" > .env.local
          echo "SERVER_SIDE_API_BASE_URL=${{secrets.SERVER_SIDE_API_BASE_URL}}" >> .env.local

      - name: Build
        run: npm run build

      # docker의 tty 명령어를 사용하기 위한 환경설정
      - name: Build and Publish Docker Image
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile.ui -t ${{ secrets.DOCKER_USERNAME }}/bookmarker-ui-nextjs:5.0 .
          docker push ${{ secrets.DOCKER_USERNAME }}/bookmarker-ui-nextjs:5.0
 